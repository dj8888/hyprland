# yazi.toml — Yazi 26+ uses [mgr] and %s/%s1 opener placeholders (not "$@").
[mgr]
show_hidden = true

[opener]
play = [
	{ run = "mpv %s", orphan = true, for = "linux" },
]
edit = [
	{ run = "${EDITOR:-nvim} %s", block = true, desc = "Edit", for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux" },
]

[open]
prepend_rules = [
	{ url = "*.json", use = "edit" },
	{ url = "*.sh", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.y*ml", use = "edit" },
	{ url = "*config", use = "edit" },
	{ url = "*.cfg", use = "edit" },
	{ url = "*env", use = "edit" },
	{ url = "*.d", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.txt", use = "edit" },
	{ url = ".zsh*", use = "edit" },
	{ url = "*.ini", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.xml", use = "edit" },
	{ url = "*.log", use = "edit" },
	# open with normal / gnome / kde
	{ url = "*.ods", use = "open" },
	{ url = "*.pdf", use = "open" },
	# open with multimedia player
	{ url = "*.mp3", use = "play" },
]
append_rules = [
	{ url = "*", use = "edit" },
]
